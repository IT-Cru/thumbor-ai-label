[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thumbor-ai-label"
dynamic = ["version"]
description = "Thumbor plugin that detects AI provenance metadata and composites an AI label watermark"
readme = "README.md"
requires-python = ">=3.10"
# SPDX string form (PEP 639). The TOML-table form is removed after 2027-02-18.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY.md"]
keywords = [
    "thumbor", "ai", "watermark", "label", "labelling", "provenance",
    "c2pa", "iptc", "xmp", "exif", "eu-ai-act", "deepfake", "transparency",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

# The scanner and detectors are deliberately dependency-free so they run and test
# anywhere. Thumbor itself is only needed by the filter/handler layer.
[project.optional-dependencies]
thumbor = ["thumbor>=7.8"]
c2pa = ["c2pa-python>=0.5"]
dev = ["pytest>=8", "pytest-cov>=5", "packaging>=23", "ruff>=0.16", "pre-commit>=4"]
docs = ["mkdocs-material>=9.5"]

[project.urls]
# Homepage points at the docs rather than the repository: it is what someone arriving
# from PyPI wants first, and Repository already covers the code. Documentation repeats
# that URL on purpose - Homepage is the legacy field some tooling still reads, while
# Documentation is what PyPI labels and gives a book icon to in the sidebar.
Homepage = "https://it-cru.github.io/thumbor-ai-label/"
Documentation = "https://it-cru.github.io/thumbor-ai-label/"
Repository = "https://github.com/IT-Cru/thumbor-ai-label"
Issues = "https://github.com/IT-Cru/thumbor-ai-label/issues"
Changelog = "https://github.com/IT-Cru/thumbor-ai-label/releases"

[tool.setuptools_scm]
# The version is derived from git tags, so it is never hand-edited and can never
# disagree with what was actually released.
#
# no-local-version strips the "+g1a2b3c4" local segment that setuptools-scm adds to
# untagged builds. PyPI rejects any version carrying a local segment, so leaving the
# default would make CI artefacts silently unpublishable.
local_scheme = "no-local-version"
# A tree with no tags, or a source tarball with no git metadata at all, falls back
# rather than failing the build outright.
fallback_version = "0.0.0.dev0"

[tool.setuptools]
# Listed explicitly rather than discovered, because the icon artwork is not under
# src/ and so cannot be found by scanning it. See package-dir below.
packages = [
    "thumbor_ai_label",
    "thumbor_ai_label.detect",
    "thumbor_ai_label.filters",
    "thumbor_ai_label.scan",
    "thumbor_ai_label.labelsets",
]

[tool.setuptools.package-dir]
thumbor_ai_label = "src/thumbor_ai_label"
# The label artwork lives at the repository root, where it is easy to find, review
# and fork - it is design source, not code. Wheels need it beside the code that
# loads it, so it is mapped in as a data-only subpackage. It carries no
# __init__.py and is never imported; thumbor_ai_label.icons resolves it by path.
#
# The names differ because src/thumbor_ai_label/icons.py already claims "icons".
"thumbor_ai_label.labelsets" = "ai-labels"

[tool.setuptools.package-data]
"thumbor_ai_label.labelsets" = ["*/*.png", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Narrowly silence Thumbor's own utcnow/utcfromtimestamp deprecations so warnings
# raised by this package stay visible. Not a blanket ignore.
filterwarnings = [
    "error::DeprecationWarning:thumbor_ai_label",
    "ignore:datetime.datetime.utc:DeprecationWarning:thumbor",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's defaults, which shift between
# releases - otherwise a routine ruff upgrade becomes a surprise CI failure.
#
# BLE (blind-except) is selected on purpose even though this codebase catches broadly
# by design. Containment is a deliberate property here: labelling must not take image
# delivery down, and the scanner must never raise on hostile input. Selecting the rule
# forces every such site to carry an explicit `# noqa: BLE001` and an explanation, so a
# careless broad except cannot slip in disguised as a deliberate one.
select = ["E", "F", "W", "I", "UP", "B", "RUF", "BLE", "S"]

[tool.ruff.lint.per-file-ignores]
# S101: asserting is what a test is for.
# S311: `random` drives the fuzz corpus. Seeded and reproducible on purpose; the rule
#       is about cryptographic use, which this is not.
"tests/**" = ["S101", "S311"]
