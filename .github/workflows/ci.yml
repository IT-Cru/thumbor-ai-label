name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by release.yml so a tag is gated by the same matrix, not a copy of it.
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Runs exactly what .pre-commit-config.yaml runs locally, so the ruff version
      # pinned there is the single source of truth and CI cannot drift from a
      # contributor's machine. The action caches hook environments.
      - uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Thumbor 7.8 requires >=3.10 and ships wheels through 3.14.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from tags, so a shallow clone
          # without history would silently produce the fallback version.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev,thumbor]'

      - name: Test
        run: pytest --cov=thumbor_ai_label --cov-report=term-missing --cov-fail-under=100

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: python -m pip install --upgrade pip build twine && python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      # The label artwork lives in ai-labels/ at the repository root and is mapped
      # into the wheel by pyproject's package-dir. Nothing about that mapping is
      # exercised by the test suite, which runs against a checkout where the
      # artwork is found in place - so a wheel could ship with no icons at all and
      # every test would still pass. Assert the payload here instead.
      - name: Verify the wheel carries every icon set
        run: |
          python - <<'EOF'
          import glob, zipfile

          SETS = ("default", "default-light", "eu", "eu-white")
          STATES = ("ai_generated", "ai_manipulated", "ai_composite", "unknown")

          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          missing = [
              f"thumbor_ai_label/labelsets/{s}/{state}.png"
              for s in SETS
              for state in STATES
              if f"thumbor_ai_label/labelsets/{s}/{state}.png" not in names
          ]
          if missing:
              raise SystemExit(f"{wheel} is missing {len(missing)} icons:\n  " + "\n  ".join(missing))
          print(f"{wheel}: all {len(SETS) * len(STATES)} icons present")
          EOF

      - name: Show resolved version
        run: ls dist/

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
