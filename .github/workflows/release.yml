name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The full CI matrix, not a copy of it. A tag can point at any commit, so a
  # release must not assume the code was ever tested.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from tags; a shallow clone would
          # silently produce the fallback version and ship it.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: python -m pip install --upgrade pip build twine && python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Verify the built version matches the tag
        # Guards the failure mode that silently ships garbage: if setuptools-scm
        # cannot see the tag it falls back to 0.0.0.dev0 rather than failing.
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls -1 dist/
          test -f "dist/thumbor_ai_label-${version}.tar.gz" \
            || { echo "::error::built version does not match tag ${GITHUB_REF_NAME}"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Uses the gh CLI rather than a third-party action: fewer external
      # dependencies in the path that produces release artefacts.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/thumbor-ai-label
    permissions:
      # OIDC for Trusted Publishing. No PyPI token exists anywhere - not on a
      # laptop, not in repository secrets.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Waits for approval first: the `pypi` environment requires a reviewer.
      # PyPI is append-only, so a bad version number is burned permanently.
      - uses: pypa/gh-action-pypi-publish@release/v1
